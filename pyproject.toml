[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corthex"
version = "0.1.0"
description = "Cross-platform client and operator CLI for Corthex Remote Brain"
readme = "docs/cli.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Porthex"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
corthex = "corthex.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["corthex*"]
